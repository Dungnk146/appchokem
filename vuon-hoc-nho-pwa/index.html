<style>

:root{

  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1914; --surface:#172620; --fg:#E7F2EA; --muted:#9DB4A5; --line:#27392F;
  --leaf:#4CC47E; --leaf-ink:#08210F; --leaf-soft:#1C3A2A;
  --sun:#F4C13F; --sun-ink:#2D2100; --sun-soft:#3A3115;
  --sky:#6CB2F0; --sky-soft:#1B3047;
  --bad:#FF7B71; --bad-soft:#3F201D; --soil:#B58260; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1914; --surface:#172620; --fg:#E7F2EA; --muted:#9DB4A5; --line:#27392F;
  --leaf:#4CC47E; --leaf-ink:#08210F; --leaf-soft:#1C3A2A;
  --sun:#F4C13F; --sun-ink:#2D2100; --sun-soft:#3A3115;
  --sky:#6CB2F0; --sky-soft:#1B3047;
  --bad:#FF7B71; --bad-soft:#3F201D; --soil:#B58260; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.35rem} h3{font-size:1.1rem}

button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;flex-wrap:wrap}

.pill.star{background:var(--sun-soft);border-color:var(--sun)}
.pill.fire{background:var(--leaf-soft);border-color:var(--leaf)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.plain{border:0;background:transparent;padding:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:16px;padding:14px 22px;font-weight:800;font-size:1.05rem;background:var(--leaf);color:var(--leaf-ink);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.big{width:100%;font-size:1.25rem;padding:18px 22px;font-family:var(--display)}
.btn.alt{background:var(--surface);color:var(--fg);border:2px solid var(--line);box-shadow:none}
.btn.sun{background:var(--sun);color:var(--sun-ink)}

.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.bar{height:14px;border-radius:99px;background:var(--leaf-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .5s}
.bar.sun{background:var(--sun-soft)} .bar.sun>i{background:var(--sun)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.chip.err{background:var(--bad-soft)} .chip.vi{background:var(--sun-soft)} .chip.ok{background:var(--leaf-soft)}
.garden{display:flex;gap:16px;align-items:center}

.week{display:flex;gap:6px}
.dot{flex:1;min-width:0;text-align:center;font-size:.75rem;font-weight:800;color:var(--muted)}
.dot b{display:block;margin:3px auto 0;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.dot.done b{background:var(--leaf);border-color:var(--leaf)}
.dot.today b{border-color:var(--sky)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}

.tab{flex:1;border:0;background:transparent;border-radius:14px;padding:8px 4px;font-weight:800;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}

.qhead{display:flex;align-items:center;gap:12px}
.qhead .bar{flex:1}
.qtext{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.3;white-space:pre-line}
.ctx{white-space:pre-line;background:var(--bg);border-radius:14px;padding:12px 14px;font-size:1.05rem}

.viz.pic{margin:6px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;font-size:1.2rem;font-weight:800;text-align:left;min-width:0;overflow-wrap:anywhere}

.numbox.right{border-color:var(--leaf);background:var(--leaf-soft)} .numbox.wrong{border-color:var(--bad);background:var(--bad-soft)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 0;font-family:var(--display);font-size:1.5rem;font-weight:700}
.key:disabled{opacity:.5}
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fb.hint{background:var(--sun-soft)} .fb.ok{background:var(--leaf-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display);font-size:1.25rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.badge svg{width:52px;height:52px}
.badge.lock{opacity:.55}
.badge b{font-size:.9rem;line-height:1.2} .badge span{font-size:.75rem;color:var(--muted);line-height:1.25}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.skill .bar{grid-column:1/-1;height:10px}
.tag{font-size:.75rem;font-weight:800;padding:2px 9px;border-radius:99px}
.tag.g{background:var(--leaf-soft)} .tag.m{background:var(--sun-soft)} .tag.b{background:var(--bad-soft)} .tag.n{background:var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
input[type=text],input[type=number],input[type=password]{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
label{font-weight:800;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.err-item{border-top:2px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:300px;height:auto}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px;font-weight:700}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tbtn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;display:flex;flex-direction:column;gap:2px;min-width:0;line-height:1.25}
.tbtn i{font-style:normal;font-size:.85rem;font-weight:800;color:var(--muted)}
.tbtn.plus{border-color:var(--leaf);background:var(--leaf-soft)}
.tbtn.minus{border-color:var(--bad);background:var(--bad-soft)}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:688px;margin-inline:auto;z-index:6;
  border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sky-soft);border:2px solid var(--sky);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.ledger{display:flex;justify-content:space-between;gap:10px;border-top:2px dashed var(--line);padding-top:8px;align-items:center}
.delta{font-family:var(--display);font-weight:800;font-size:1.1rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.p{color:var(--leaf)} .delta.m{color:var(--bad)}
.ptsrow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:center}
.ptsrow span{font-weight:700}
select{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
details summary{cursor:pointer;font-weight:800}
details p{margin-top:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:52px;height:auto;flex:none}
.res .chico{width:72px;height:auto}
.scope{display:flex;flex-direction:column;gap:6px;border-top:2px dashed var(--line);padding-top:8px}
.hide{display:none!important}
.res{text-align:center;align-items:center}
.res .score{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1}
@media (max-width:420px){.garden{flex-direction:column;align-items:flex-start}.qtext{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
/* ===== Tiện ích ===== */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function mkRng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey=()=>dkey(new Date());
function addDays(k,n){const [y,m,d]=k.split("-").map(Number);return dkey(new Date(y,m-1,d+n))}
const DOW=["CN","T2","T3","T4","T5","T6","T7"];
const DOWFULL=["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];

/* ===== Câu hỏi ===== */
function mkChoice(skill,prompt,correct,wrongs,x){
  const opts=x&&x.fixed?[correct].concat(wrongs):shuffle([correct].concat(wrongs));
  const q={id:skill+":"+(x&&x.sid||Math.floor(R()*1e9)),skill,type:"choice",prompt,opts,a:opts.indexOf(correct)};
  if(x&&x.fixed){q.opts=x.fixed;q.a=x.fixed.indexOf(correct)}
  if(x&&x.ctx)q.ctx=x.ctx; if(x&&x.viz)q.viz=x.viz; if(x&&x.why)q.why=x.why;
  return q;
}
function mkNum(skill,prompt,ans,why){return{id:skill+":"+Math.floor(R()*1e9),skill,type:"number",prompt,a:ans,why}}

/* --- Toán: sinh câu hỏi ngẫu nhiên theo mức 1-3 --- */
function genCong(lv){
  if(lv===3){let a,b,c;do{a=ri(8,45);b=ri(8,45);c=ri(5,40)}while(a+b+c>100);return mkNum("cong",a+" + "+b+" + "+c+" = ?",a+b+c,"Cộng lần lượt: "+a+" + "+b+" = "+(a+b)+", rồi "+(a+b)+" + "+c+" = "+(a+b+c))}
  let a,b;
  if(lv===1){const t1=ri(1,8),t2=ri(1,9-t1),x1=ri(1,8),x2=ri(1,9-x1);a=t1*10+x1;b=t2*10+x2}
  else{let x1,x2;do{x1=ri(2,9);x2=ri(2,9)}while(x1+x2<10);const t1=ri(1,7),t2=ri(1,8-t1);a=t1*10+x1;b=t2*10+x2}
  return mkNum("cong",a+" + "+b+" = ?",a+b,a+" + "+b+" = "+(a+b)+(lv===2?" (nhớ 1 sang hàng chục)":""));
}
function genTru(lv){
  if(lv===3){let a,b,c;do{a=ri(40,100);b=ri(5,35);c=ri(5,30)}while(a-b-c<1);return mkNum("tru",a+" − "+b+" − "+c+" = ?",a-b-c,"Trừ lần lượt: "+a+" − "+b+" = "+(a-b)+", rồi "+(a-b)+" − "+c+" = "+(a-b-c))}
  let a,b;
  if(lv===1){do{const t1=ri(3,9),t2=ri(1,t1),x1=ri(1,9),x2=ri(0,x1);a=t1*10+x1;b=t2*10+x2}while(a<=b)}
  else{let x1,x2;do{x1=ri(0,8);x2=ri(1,9)}while(x1>=x2);const t1=ri(3,9),t2=ri(1,t1-1);a=t1*10+x1;b=t2*10+x2}
  return mkNum("tru",a+" − "+b+" = ?",a-b,a+" − "+b+" = "+(a-b)+(lv===2?" (mượn 1 chục)":""));
}
function tbl(lv){return lv===1?[2,5]:lv===2?[3,4]:[2,3,4,5]}
function genNhan(lv){const a=pick(tbl(lv)),b=ri(1,10);const sw=R()<.5;return mkNum("nhan",sw?a+" × "+b+" = ?":b+" × "+a+" = ?",a*b,a+" × "+b+" = "+(a*b))}
function genChia(lv){const a=pick(tbl(lv)),q=ri(1,10);return mkNum("chia",(a*q)+" : "+a+" = ?",q,"Vì "+a+" × "+q+" = "+(a*q)+" nên "+(a*q)+" : "+a+" = "+q)}
function genSoSanh(lv){
  if(lv===3){const big=R()<.5;const s=new Set();while(s.size<4)s.add(ri(100,999));const arr=[...s];const c=big?Math.max(...arr):Math.min(...arr);
    return mkChoice("sosanh",big?"Số nào lớn nhất?":"Số nào bé nhất?",String(c),arr.filter(n=>n!==c).map(String),{why:"So sánh hàng trăm trước, rồi đến hàng chục."})}
  const max=lv===1?99:999,min=lv===1?10:100;let a=ri(min,max),b=ri(min,max);if(R()<.15)b=a;
  if(lv===2&&R()<.4){b=Math.floor(a/10)*10+ri(0,9)}
  const c=a>b?">":a<b?"<":"=";
  return mkChoice("sosanh","Điền dấu thích hợp:\n"+a+"  ...  "+b,c,[],{fixed:[">","<","="],why:a+(c==="="?" bằng ":c===">"?" lớn hơn ":" bé hơn ")+b});
}
function genTimX(lv){
  if(lv===1){const a=ri(5,60),x=ri(5,95-a);return mkNum("timx","Tìm x:  x + "+a+" = "+(x+a),x,"x = "+(x+a)+" − "+a+" = "+x)}
  if(lv===2){const a=ri(5,50),b=ri(5,95-a);return mkNum("timx","Tìm x:  x − "+a+" = "+b,a+b,"x = "+b+" + "+a+" = "+(a+b))}
  const a=ri(30,99),b=ri(5,a-5);return mkNum("timx","Tìm x:  "+a+" − x = "+b,a-b,"x = "+a+" − "+b+" = "+(a-b));
}
function genDoLuong(lv){
  const n=ri(1,9);
  if(lv===1)return mkNum("doluong",n+" dm = ? cm",n*10,"1 dm = 10 cm nên "+n+" dm = "+(n*10)+" cm");
  if(lv===2){return R()<.5?mkNum("doluong",n+" m = ? dm",n*10,"1 m = 10 dm nên "+n+" m = "+(n*10)+" dm"):mkNum("doluong",n+" m = ? cm",n*100,"1 m = 100 cm nên "+n+" m = "+(n*100)+" cm")}
  return R()<.5?mkNum("doluong",(n*10)+" cm = ? dm",n,"10 cm = 1 dm nên "+(n*10)+" cm = "+n+" dm"):mkNum("doluong",(n*10)+" dm = ? m",n,"10 dm = 1 m nên "+(n*10)+" dm = "+n+" m");
}
function clockTxt(h,m){return m===0?h+" giờ":h+" giờ "+m+" phút"}
function genDongHo(lv){
  const h=ri(1,12),m=lv===1?0:lv===2?30:pick([15,45,15,45,30]);
  const c=clockTxt(h,m),w=new Set(),h1=h%12+1,h2=(h+10)%12+1;
  [clockTxt(h1,m),clockTxt(h2,m)].forEach(x=>w.add(x));
  if(m===15)w.add(clockTxt(h,45)); else if(m===45)w.add(clockTxt(h,15)); else if(m===30)w.add(clockTxt(h,0)); else w.add(clockTxt(h,30));
  w.delete(c);
  return mkChoice("dongho","Đồng hồ chỉ mấy giờ?",c,[...w].slice(0,3),{viz:{clock:[h,m]},why:"Kim ngắn chỉ giờ, kim dài chỉ phút: "+c});
}
const NAMES=["Lan","Nam","Hà","Minh","Mai","An","Bình","Hoa","Tú","Linh"],THINGS=["quả táo","cái kẹo","quyển vở","viên bi","bông hoa","cái bút","quả cam","chiếc bánh"],CONT=["hộp","đĩa","túi","giỏ"],GIVERS=["Mẹ","Bà","Chị","Cô giáo"];
function mathLesson(){return(S.profile&&S.profile.mathLesson)||25}
/* [a, b] với a > b, theo bài Toán đang học */
function pairSub(){
  const L=mathLesson();let a,b;
  if(L<11){a=ri(12,19);b=ri(1,a%10)}
  else if(L<22){do{a=ri(11,19);b=ri(2,9)}while(a-b<2)}
  else{a=ri(30,99);b=ri(5,a-5)}
  return[a,b];
}
function genLoiVan(lv){
  const L=mathLesson(),n=pick(NAMES),m=pick(NAMES.filter(x=>x!==n)),t=pick(THINGS);
  const k=pick(L>=13?["add","sub","more","less"]:["add","sub"]),isAdd=k==="add"||k==="more";let a,b;
  if(L<19){if(isAdd){do{a=ri(3,12);b=ri(3,9)}while(a+b>20||a+b<11)}else{[a,b]=pairSub()}}
  else if(isAdd){const ao=lv===1?ri(1,8):ri(2,9);a=ri(1,6)*10+ao;b=lv===1?ri(1,9-ao):ri(10-ao,9)}
  else if(lv===1){const ao=ri(1,9);a=ri(2,8)*10+ao;b=ri(1,ao)}
  else{const ao=ri(0,8);a=ri(3,9)*10+ao;b=ri(ao+1,9)}
  const s=isAdd?a+b:a-b,why="Phép tính: "+a+(isAdd?" + ":" − ")+b+" = "+s;
  if(k==="add")return mkNum("loivan",n+" có "+a+" "+t+". "+pick(GIVERS)+" cho thêm "+b+" "+t+". Hỏi "+n+" có tất cả bao nhiêu "+t+"?",s,why);
  if(k==="sub")return mkNum("loivan",n+" có "+a+" "+t+". "+n+" cho bạn "+b+" "+t+". Hỏi "+n+" còn lại bao nhiêu "+t+"?",s,why);
  if(k==="more")return mkNum("loivan",n+" có "+a+" "+t+". "+m+" có nhiều hơn "+n+" "+b+" "+t+". Hỏi "+m+" có bao nhiêu "+t+"?",s,why);
  return mkNum("loivan",n+" có "+a+" "+t+". "+m+" có ít hơn "+n+" "+b+" "+t+". Hỏi "+m+" có bao nhiêu "+t+"?",s,why);
}
function genHonKem(){

function genKgLit(){

function genPair(skill,pairs,label){
  const p=pick(pairs),i=ri(0,1),w=p[i],c=p[1-i];const pool=[].concat(...pairs.filter(x=>x!==p));const d=new Set();
  while(d.size<3){const x=pick(pool);if(x!==c&&x!==w)d.add(x)}

function genCong20(lv){
  const add=R()<.5;let a,b,s;
  if(add){do{a=ri(2,9);b=ri(2,9)}while(a+b<11);s=a+b}
  else{s=ri(11,18);b=ri(s-10+1,9);a=s}
  if(lv<=1){
    if(add){const t=10-a;return mkNum("cong20",a+" + "+b+" = ?",s,"Tách "+b+" = "+t+" + "+(b-t)+". Làm tròn 10 trước: "+a+" + "+t+" = 10, rồi 10 + "+(b-t)+" = "+s)}
    const x=a-10;return mkNum("cong20",a+" − "+b+" = ?",a-b,"Tách "+b+" = "+x+" + "+(b-x)+". "+a+" − "+x+" = 10, rồi 10 − "+(b-x)+" = "+(a-b));
  }
  if(add)return mkNum("cong20","Điền số vào chỗ trống:\n"+a+" + … = "+s,b,"Số hạng còn thiếu = "+s+" − "+a+" = "+b);
  return mkNum("cong20","Điền số vào chỗ trống:\n"+a+" − … = "+(a-b),b,"Số trừ = "+a+" − "+(a-b)+" = "+b);
}
function genLienTruoc(){

    mkNum("lientruoc","Số liền sau của "+n+" là số nào?",n+1,"Số liền sau hơn "+n+" một đơn vị: "+n+" + 1 = "+(n+1));
}

function genTuDuy(){
  const L=mathLesson(),T=[];
  T.push(()=>{const d=pick([2,3,4,5,10]),up=R()<.7,a=up?ri(1,30):ri(60,95),n=5,seq=[];
    for(let i=0;i<n;i++)seq.push(up?a+i*d:a-i*d);

    return mkNum("tuduy","Tìm số tiếp theo theo quy luật:\n"+seq.slice(0,n-1).join(", ")+", ?",seq[n-1],rule+" Số tiếp theo là "+seq[n-1]+".")});
  T.push(()=>{const t=shuffle(NAMES).slice(0,3),a=ri(2,9),b=ri(2,9),c=ri(5,30);

    const o=[...new Set([r,w,r+10,r-1])].map(String);
    return mkChoice("tuduy","Bạn "+pick(NAMES)+" tính: "+a+" + "+b+" = "+w+".\nBạn đã làm sai. Kết quả đúng là:",String(r),o.filter(x=>x!==String(r)),{why:a+" + "+b+" = "+r+". Bạn đã quên nhớ 1 sang hàng chục."})});
  if(L>=22)T.push(()=>{let t,x,b;do{t=ri(3,9);x=ri(0,7);b=ri(x+1,9)}while(false);const a=t*10+x,r=a-b,w=t*10+(b-x);
    const o=[...new Set([r,w,r+1,r-1])].map(String);
    return mkChoice("tuduy","Bạn "+pick(NAMES)+" tính: "+a+" − "+b+" = "+w+".\nBạn đã làm sai. Kết quả đúng là:",String(r),o.filter(x=>x!==String(r)),{why:a+" − "+b+" = "+r+". Hàng đơn vị "+x+" không đủ trừ "+b+" nên phải mượn 1 chục."})});
  T.push(()=>{const k=ri(0,2);
    if(k===0){const X=ri(23,90);return mkNum("tuduy","Số liền sau của một số là "+X+".\nSố liền trước của số đó là bao nhiêu?",X-2,"Số đó là "+X+" − 1 = "+(X-1)+". Số liền trước của nó là "+(X-1)+" − 1 = "+(X-2)+".")}
    const big=L>=22,x=big?ri(10,60):ri(3,9),d=big?ri(12,35):ri(3,9);
    if(k===1)return mkNum("tuduy","Nam nghĩ một số. Lấy số đó cộng "+d+" được "+(x+d)+".\nSố Nam nghĩ là số nào?",x,"Số đó là "+(x+d)+" − "+d+" = "+x+".");
    return mkNum("tuduy","Nam nghĩ một số. Lấy số đó trừ đi "+d+" được "+x+".\nSố Nam nghĩ là số nào?",x+d,"Số đó là "+x+" + "+d+" = "+(x+d)+".")});
  T.push(()=>{let a,b,c;do{b=ri(2,9);c=ri(2,9);a=ri(b+c+1,20)}while(a-(b+c)<1);
    return mkNum("tuduy","Số nào điền vào chỗ trống?\n"+a+" − … = "+b+" + "+c,a-b-c,"Tính vế phải trước: "+b+" + "+c+" = "+(b+c)+". Rồi "+a+" − "+(b+c)+" = "+(a-b-c)+".")});
  T.push(()=>{const x=ri(10,80),y=x+ri(4,12);return mkNum("tuduy","Có bao nhiêu số nằm giữa "+x+" và "+y+"?",y-x-1,"Các số đó là từ "+(x+1)+" đến "+(y-1)+", có "+(y-x-1)+" số.")});
  T.push(()=>{const p=ri(1,9),q=ri(1,9),v=shuffle([p,10-p,q,10-q]);
    return mkNum("tuduy","Tính nhanh bằng cách ghép các số có tổng bằng 10:\n"+v.join(" + "),20,"Ghép cặp có tổng bằng 10: "+p+" + "+(10-p)+" = 10 và "+q+" + "+(10-q)+" = 10. Vậy tổng là 10 + 10 = 20.")});
  if(L>=15)T.push(()=>{const a=ri(5,30),b=ri(3,15),s=2*a+b;
    return R()<.5?mkNum("tuduy","Can bé đựng "+a+" lít nước. Can to đựng nhiều hơn can bé "+b+" lít nước.\nCả hai can đựng bao nhiêu lít nước?",s,"Can to đựng "+a+" + "+b+" = "+(a+b)+" lít. Cả hai can: "+a+" + "+(a+b)+" = "+s+" lít."):
      mkNum("tuduy","Bao gạo nhỏ nặng "+a+" kg. Bao gạo to nặng hơn bao nhỏ "+b+" kg.\nCả hai bao nặng bao nhiêu ki-lô-gam?",s,"Bao to nặng "+a+" + "+b+" = "+(a+b)+" kg. Cả hai bao: "+a+" + "+(a+b)+" = "+s+" kg.")});
  return pick(T)();
}

<script>

const LS_KEY="vuonhocnho.v1";
const defaults=()=>({v:6,place:{res:{},cur:{},adv:{},runs:0},focus:[],profile:{name:"Kem",teacher:"Cô Dung",pin:"",taskPts:{},skillOff:{tratnghia:true,dongnghia:true},mathLesson:25,perDay:10,rewardName:"Đi công viên cuối tuần",rewardTarget:100,rewardBase:0},

let dbDoc=null,storeMode="local",saveTimer=null,saving=false;

];

function skillWeight(id){const k=S.skills[id],f=(S.focus&&S.focus.includes(id)?1.8:1)*(SKILLS[id].adv?0.55:1);if(!k||!k.done)return 1.4*f;return (1.2+(1-k.correct/k.done)*2.5)*f}
function advOpen(subj){return !!(S.place&&S.place.adv&&S.place.adv[subj])}
function bankPick(skill,used){
  const n=BANK[skill].length;let best=[],min=1e9;
  for(let i=0;i<n;i++){const id=skill+":"+(skill+i);if(used.has(id))continue;const c=S.seen[id]||0;if(c<min){min=c;best=[i]}else if(c===min)best.push(i)}
  return best.length?pick(best):ri(0,n-1);
}
function makeQ(skill,used){
  const def=SKILLS[skill];
  for(let t=0;t<10;t++){
    const q=def.bank?fromBank(skill,bankPick(skill,used)):def.gen(skillLevel(skill));
    const key=q.skill+"|"+q.prompt+"|"+(q.ctx||"")+"|"+(q.type==="choice"?q.opts[q.a]:"")+"|"+(q.viz?JSON.stringify(q.viz):"");
    if(!used.has(key)&&!used.has(q.id)){used.add(key);used.add(q.id);return q}
  }
  return def.bank?fromBank(skill,bankPick(skill,new Set())):def.gen(skillLevel(skill));
}

 sosanh:{from:1,cap:()=>1},lientruoc:{from:2},thuatngu:{from:3},honkem:{from:4},

function skillOn(id){
  const d=SKILLS[id];if(!d)return false;
  if(d.subj==="toan"){const r=MATH_RULES[id];return !!r&&mathLesson()>=r.from}
  return !(S.profile.skillOff||{})[id];
}
function capOf(id){const r=MATH_RULES[id];return r&&r.cap?r.cap(mathLesson()):3}
function skillLevel(id){return Math.min((S.skills[id]&&S.skills[id].lv)||1,capOf(id))}
function buildSession(mode,date,o){
  o=o||{};R=mkRng(hashStr(date+mode+(o.salt||"")+S.profile.name));
  const n=o.n||(mode==="daily"?S.profile.perDay:5),used=new Set(),qs=[];
  if(mode==="daily"){
    const cand=S.errors.filter(e=>e.date<date&&skillOn(e.q.skill)&&(!SKILLS[e.q.skill].adv||advOpen(SKILLS[e.q.skill].subj))).slice(0,Math.round(n*0.3));
    cand.forEach(e=>{const q=Object.assign({},e.q,{retry:true});used.add(q.id);qs.push(q)});
  }
  PICFORCE=!!o.pic;
  const base=Object.keys(SKILLS).filter(id=>(!o.subj||SKILLS[id].subj===o.subj)&&(!o.skill||id===o.skill)&&(!o.pic||SKILLS[id].pic));
  let ids=o.skill?base:base.filter(skillOn).filter(id=>!SKILLS[id].adv||advOpen(SKILLS[id].subj));if(!ids.length)ids=base.filter(id=>SKILLS[id].subj==="vi").length?base.filter(id=>SKILLS[id].subj==="vi"):base;
  const rest=n-qs.length,counts={};
  const toan=ids.filter(i=>SKILLS[i].subj==="toan"),vi=ids.filter(i=>SKILLS[i].subj==="vi");
  let subjList=[];
  if(toan.length&&vi.length){const m=Math.round(rest*0.55);for(let i=0;i<rest;i++)subjList.push(i<m?toan:vi);subjList=shuffle(subjList)}
  else for(let i=0;i<rest;i++)subjList.push(toan.length?toan:vi);
  subjList.forEach(group=>{
    const ws=group.map(id=>skillWeight(id)/(1+(counts[id]||0)*1.6));
    let r=R()*ws.reduce((a,b)=>a+b,0),pickId=group[group.length-1];
    for(let i=0;i<group.length;i++){r-=ws[i];if(r<=0){pickId=group[i];break}}
    counts[pickId]=(counts[pickId]||0)+1;qs.push(makeQ(pickId,used));
  });
  R=Math.random;PICFORCE=false;
  if(mode==="daily")qs.sort((a,b)=>(SKILLS[a.skill].subj==="toan"?0:1)-(SKILLS[b.skill].subj==="toan"?0:1));
  return{mode,date,qs,i:0,res:[],finished:false,started:Date.now(),label:o.label||""};
}

/* ===== Chấm điểm ===== */
function isCorrect(q,given){return q.type==="number"?Number(given)===q.a:given===q.a}
function extraStarsToday(){const d=S.days[todayKey()];return d?d.xstars||0:0}
function answer(sess,given){
  const q=sess.qs[sess.i],ok=isCorrect(q,given),date=sess.date;
  const day=S.days[date]||(S.days[date]={correct:0,total:0,stars:0,xcorrect:0,xtotal:0,xstars:0,done:false});
  const k=sk(q.skill);k.done++;if(ok)k.correct++;k.recent.push(ok?1:0);k.recent=k.recent.slice(-8);
  if(SKILLS[q.skill].lvl&&k.recent.length>=5){
    const a=k.recent.slice(-5).reduce((x,y)=>x+y,0)/5;
    if(a>=.8&&k.lv<capOf(q.skill)){k.lv++;k.recent=[]}else if(a<=.4&&k.lv>1){k.lv--;k.recent=[]}
  }
  if(SKILLS[q.skill].bank)S.seen[q.id]=(S.seen[q.id]||0)+1;
  let gain=0;
  if(sess.mode==="daily"){day.total++;if(ok){day.correct++;gain=1;day.stars++}}
  else{day.xtotal++;if(ok){day.xcorrect++;if((day.xstars||0)<10){gain=1;day.xstars=(day.xstars||0)+1}}}
  S.stars+=gain;
  const had=S.errors.length;
  if(ok){S.errors=S.errors.filter(e=>e.q.id!==q.id);if(had>0&&S.errors.length===0)S.flags.cleared=true}
  else if(!S.errors.some(e=>e.q.id===q.id)){const c=Object.assign({},q);delete c.retry;S.errors.push({q:c,date});if(S.errors.length>30)S.errors.shift()}
  sess.gain=(sess.gain||0)+gain;sess.res[sess.i]={ok,ans:given};persist();
  return{ok,gain};
}
function finish(sess){
  const correct=sess.res.filter(r=>r&&r.ok).length,total=sess.qs.length;let bonus=0;
  sess.finished=true;
  if(sess.mode==="daily"){
    const day=S.days[sess.date]||(S.days[sess.date]={correct:0,total:0,stars:0,xcorrect:0,xtotal:0,xstars:0,done:false});
    day.done=true;bonus=2;
    if(correct===total){bonus+=3;S.perfects++}
    const st=streak();if(st>S.maxStreak)S.maxStreak=st;
    if([3,7,14,30].includes(st))bonus+=5;
    day.stars+=bonus;S.stars+=bonus;
  }
  const newBadges=checkBadges();
  sess.summary={correct,total,bonus,stars:(sess.gain||0)+bonus,newBadges:newBadges.map(b=>b.id),streak:streak()};persist();
}

function fmtD(k){return Number(k.slice(8))+"/"+Number(k.slice(5,7))}
function ledgerRow(e,undo){
  const sign=e.pts>0?"+":e.pts<0?"−":"";
  return '<div class="ledger"><div class="grow"><b>'+esc(e.label)+'</b><div class="small muted">'+fmtD(e.date)+' · '+esc(e.by)+(e.note?' · '+esc(e.note):'')+'</div></div>'+
   '<span class="delta '+(e.type==="bonus"?"p":"m")+'">'+sign+Math.abs(e.pts)+' sao</span>'+
   (undo?'<button class="btn alt" style="padding:4px 10px;font-size:.85rem;box-shadow:none" data-act="undo" data-n="'+e.n+'">Hoàn tác</button>':'')+'</div>';
}
const $app=()=>document.getElementById("app");
function header(){
  const lv=levelInfo(S.stars),d=new Date();
  return '<div class="top"><div class="hello brand">'+chicoSVG(52)+'<div>Chào '+esc(S.profile.name)+'!<small>'+DOWFULL[d.getDay()]+', ngày '+d.getDate()+'/'+(d.getMonth()+1)+' · Gia sư tại nhà lớp 2</small></div></div>'+
  '<div class="pills"><span class="pill star" title="Tổng số sao">'+starI+S.stars+'</span><span class="pill fire" title="Số ngày học liên tiếp">'+fireI+streak()+' ngày</span></div></div>';
}
function renderTabs(){
  const t=[["home","Hôm nay",ICON.home],["practice","Luyện thêm",ICON.pen],["prog","Thành tích",ICON.star],["parent","Cô &amp; Bố mẹ",ICON.user]];
  document.getElementById("tabs").innerHTML=t.map(x=>'<button class="tab" data-act="tab" data-t="'+x[0]+'"'+(ui.tab===x[0]?' aria-current="page"':'')+'>'+x[2]+x[1]+'</button>').join("");
  document.querySelector(".tabs").classList.toggle("hide",!!ui.play);
}
function weekStrip(){
  const t=todayKey();let o='<div class="week">';
  for(let i=6;i>=0;i--){const k=addDays(t,-i),[y,m,d]=k.split("-").map(Number),dow=new Date(y,m-1,d).getDay();
    o+='<div class="dot'+(S.days[k]&&S.days[k].done?" done":"")+(i===0?" today":"")+'">'+DOW[dow]+'<b></b></div>'}
  return o+'</div>';
}
function planChips(){
  const qs=S.daily.qs,toan=qs.filter(q=>SKILLS[q.skill].subj==="toan").length,vi=qs.length-toan,re=qs.filter(q=>q.retry).length;
  return '<div class="chips"><span class="chip">'+toan+' câu Toán</span><span class="chip vi">'+vi+' câu Tiếng Việt</span>'+(re?'<span class="chip err">'+re+' câu sửa lỗi</span>':'')+'</div>';
}
function placeRow(subj,name,mins){
  const ev=S.place.res[subj],pr=placeProgress(subj),n=PLACE_PLAN[subj].length;
  const st=ev?'<span class="chip ok">Đã xong</span>':pr?'<span class="chip">Đang làm '+pr+'/'+n+'</span>':'<span class="chip">Chưa làm</span>';
  return '<div class="scope"><div class="row" style="justify-content:space-between"><b>'+name+'</b>'+st+'</div><div class="small muted">'+n+' câu, khoảng '+mins+' phút</div>'+
   (ev?'<button class="btn alt" data-act="placeView" data-subj="'+subj+'">Xem kết quả</button>':'<button class="btn'+(subj==="vi"?" sun":"")+'" data-act="placeStart" data-subj="'+subj+'">'+(pr?"Làm tiếp":"Bắt đầu")+'</button>')+'</div>';
}
function placeCard(){
  const P=S.place;
  if(P.res.toan&&P.res.vi)return '<div class="card"><h3>Lộ trình khởi đầu đã sẵn sàng</h3><p class="small muted">Đã có kết quả kiểm tra đầu vào của '+esc(S.profile.name)+'. Bài hằng ngày đang ưu tiên những nội dung con cần ôn.</p><button class="btn alt" data-act="placeView">Xem kết quả và lộ trình</button></div>';
  return '<div class="card"><h2>Kiểm tra đầu vào</h2><p class="muted">Tổng hợp kiến thức 13 tuần đã học, chia thành hai phần. Nên làm vào hai tối khác nhau. Câu sai sẽ có gợi ý và con được thử lại một lần. Bài này không tính sao và không tính vào chuỗi ngày.</p>'+placeRow("toan","Toán",20)+placeRow("vi","Tiếng Việt",20)+'</div>';
}
function viewHome(){
  const lv=levelInfo(S.stars),dd=S.days[todayKey()],done=dd&&dd.done,sess=S.daily;
  let o='<div class="card garden"><div>'+plantSVG(lv.idx)+'</div><div class="grow" style="display:flex;flex-direction:column;gap:8px"><div class="muted small">Cây của '+esc(S.profile.name)+' đang ở cấp</div><h2>'+lv.name+'</h2>'+
   (lv.next?'<div class="bar sun"><i style="width:'+lv.pct+'%"></i></div><div class="small muted">Còn '+lv.need+' sao nữa để thành "'+lv.next+'"</div>':'<div class="small muted">Cây đã lớn nhất. Giỏi quá!</div>')+'</div></div>';
  o+=placeCard();
  if(done){
    const sm=sess.summary;
    o+='<div class="card"><h2>Hôm nay '+esc(S.profile.name)+' đã học xong!</h2><p>Đúng '+dd.correct+'/'+dd.total+' câu. '+esc(S.profile.teacher)+' rất vui. Chuỗi học hiện tại: <b>'+streak()+' ngày</b>.</p>'+weekStrip()+
     '<div class="row"><button class="btn alt grow" data-act="result">Xem lại kết quả</button><button class="btn grow" data-act="tab" data-t="practice">Luyện thêm</button></div></div>';
  }else{
    const prog=sess.res.filter(Boolean).length;
    o+='<div class="card"><h2>Bài hôm nay của '+esc(S.profile.name)+'</h2><p class="muted">'+esc(S.profile.teacher)+' chuẩn bị '+sess.qs.length+' câu, khoảng '+Math.round(sess.qs.length*0.8)+' phút. '+(prog?'Con đã làm '+prog+'/'+sess.qs.length+' câu.':'')+'</p>'+planChips()+'<p class="small muted">Làm phần Toán trước, nghỉ vài phút, rồi sang phần Tiếng Việt. Cuối mỗi phần có bài tập thêm, không bắt buộc.</p>'+
     '<button class="btn big" data-act="startDaily">'+(prog?"Làm tiếp":"Bắt đầu làm bài")+'</button>'+weekStrip()+'</div>';
  }
  const rp=Math.max(0,S.stars-S.profile.rewardBase),rt=Math.max(1,S.profile.rewardTarget),rpct=Math.min(100,Math.round(rp/rt*100));
  o+='<div class="card"><div class="row"><h3 class="grow">Phần thưởng: '+esc(S.profile.rewardName)+'</h3><span class="pill star">'+starI+Math.min(rp,rt)+'/'+rt+'</span></div><div class="bar sun"><i style="width:'+rpct+'%"></i></div>'+
   '<p class="small muted">'+(rp>=rt?"Con đủ sao rồi! Hãy nhờ bố mẹ trao phần thưởng nhé.":"Còn "+(rt-rp)+" sao nữa là con nhận được phần thưởng.")+'</p></div>';
  return o;
}
function viewPractice(){
  const left=10-extraStarsToday();
  let o='<div class="card"><h2>Luyện thêm</h2><p class="muted">Mỗi lượt 5 câu. Luyện thêm vẫn được sao, tối đa 10 sao mỗi ngày (hôm nay còn '+left+' sao). Luyện thêm không tính vào chuỗi ngày học. Đây là bài luyện bổ sung, không phải bài nguyên bản trong sách giáo khoa.</p>'+
   '<div class="row"><button class="btn alt grow" data-act="startExtra" data-pic="1">Luyện qua hình (5 câu tranh)</button></div>'+
   '<div class="row"><button class="btn grow" data-act="startExtra" data-subj="toan">5 câu Toán</button><button class="btn sun grow" data-act="startExtra" data-subj="vi">5 câu Tiếng Việt</button></div>'+
   (S.errors.length?'<button class="btn alt" data-act="startErrors">Làm lại vở sửa lỗi ('+S.errors.length+' câu)</button>':'')+'</div>';
  [["toan","Chọn kỹ năng Toán"],["vi","Chọn kỹ năng Tiếng Việt"]].forEach(g=>{
    o+='<div class="card"><h3>'+g[1]+'</h3><div class="opts one">'+Object.keys(SKILLS).filter(i=>SKILLS[i].subj===g[0]&&skillOn(i)).map(i=>'<button class="opt" data-act="startExtra" data-skill="'+i+'">'+esc(SKILLS[i].name)+'</button>').join("")+'</div></div>';
  });
  return o;
}
function chartSVG(){
  const t=todayKey(),days=[];for(let i=13;i>=0;i--){const k=addDays(t,-i),d=S.days[k]||{};days.push({k,v:(d.correct||0)+(d.xcorrect||0),done:!!d.done})}
  const max=Math.max(10,...days.map(d=>d.v)),W=560,H=190,L=30,B=24,T=14,bw=(W-L)/14;
  let o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Số câu đúng 14 ngày gần nhất">';
  [0,.5,1].forEach(f=>{const y=T+(H-B-T)*(1-f);o+='<line x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line);stroke-width:1"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*f)+'</text>'});
  days.forEach((d,i)=>{const h=(H-B-T)*d.v/max,x=L+i*bw+bw*.18,w=bw*.64,y=H-B-h;
    if(d.v)o+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" '+sf(d.done?"var(--leaf)":"var(--sun)")+'/><text x="'+(x+w/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="middle">'+d.v+'</text>';
    o+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+Number(d.k.slice(8))+'</text>'});
  return o+'</svg>';
}
function viewProg(){
  const lv=levelInfo(S.stars);
  let o='<div class="card"><h2>Khu vườn của con</h2><div class="row" style="justify-content:space-between;align-items:flex-end;flex-wrap:nowrap;overflow-x:auto;gap:2px">'+
   LEVELS.map((l,i)=>'<div style="text-align:center;opacity:'+(i<=lv.idx?1:.35)+';min-width:60px"><div style="width:60px;margin:auto">'+plantSVG(i).replace('viewBox="0 0 130 150"','viewBox="0 0 130 150" width="60" height="70"')+'</div><div class="small" style="font-weight:800">'+l.n+'</div><div class="small muted">'+l.min+' sao</div></div>').join("")+'</div></div>';
  const n=Object.keys(S.badges).length;
  o+='<div class="card"><h2>Huy hiệu ('+n+'/'+BADGES.length+')</h2><div class="badges">'+BADGES.map(b=>{const on=!!S.badges[b.id];return '<div class="badge'+(on?"":" lock")+'">'+badgeSVG(b,on)+'<b>'+b.name+'</b><span>'+b.desc+'</span></div>'}).join("")+'</div></div>';
  const L=S.ledger.slice(-10).reverse();
  o+='<div class="card"><h2>Nhật ký khen thưởng</h2>'+(L.length?L.map(e=>ledgerRow(e,false)).join(""):'<p class="muted">Chưa có ghi nhận nào. '+esc(S.profile.teacher)+' và bố mẹ sẽ cộng sao khi '+esc(S.profile.name)+' làm tốt các nhiệm vụ ở nhà.</p>')+'</div>';
  o+='<div class="card"><h2>Số câu đúng 14 ngày gần nhất</h2><div class="chart">'+chartSVG()+'</div><p class="small muted">Cột xanh là ngày đã hoàn thành bài hằng ngày. Cột vàng là ngày chỉ luyện thêm.</p></div>';
  return o;
}

  let o=cone;

  if(stage===1)o+='<path d="M-19 4Q-19 -8 0 -9Q19 -8 19 4Q19 12 14 12Q12 24 8 12Q4 16 0 12Q-5 17 -9 12Q-19 12 -19 4Z" '+st("#F8A5C8","#C8527F",1.6)+'/><path d="M-12 12Q-12 22 -10 24" stroke="#F8A5C8" stroke-width="3" fill="none" stroke-linecap="round"/>';

}

   '<circle cx="32" cy="9" r="5.5" '+sf("#E4483E","#9C241D",1.6)+'/><path d="M32 4q2-4 6-5" fill="none" style="stroke:#3DAA5C;stroke-width:1.8;stroke-linecap:round"/>'+

/* Que tính: bó chục và que lẻ */
function rods(n,x,y,crossT,crossU){
  const t=Math.floor(n/10),u=n%10;let o="";
  for(let i=0;i<t;i++){const cx=x+i*11,bad=i<(crossT||0);
    o+='<g opacity="'+(bad?.4:1)+'"><rect x="'+cx+'" y="'+y+'" width="8" height="46" rx="2" '+st("#F2B84B","#B07A12",1.2)+'/>'+[1,2,3,4,5,6,7,8,9].map(j=>'<path d="M'+cx+' '+(y+j*4.6)+'h8" stroke="#B07A12" stroke-width=".8"/>').join("")+'</g>';
    if(bad)o+='<path d="M'+(cx-4)+' '+(y+8)+'L'+(cx+12)+' '+(y+38)+'M'+(cx+12)+' '+(y+8)+'L'+(cx-4)+' '+(y+38)+'" stroke="#CF3F37" stroke-width="3" stroke-linecap="round"/>'}
  const ox=x+t*11+(t?8:0);
  for(let i=0;i<u;i++){const cx=ox+(i%3)*11,cy=y+Math.floor(i/3)*12,bad=i<(crossU||0);
    o+='<rect x="'+cx+'" y="'+(cy+22)+'" width="8" height="8" rx="2" '+st("#F2B84B","#B07A12",1.2)+' opacity="'+(bad?.4:1)+'"/>';
    if(bad)o+='<path d="M'+(cx-2)+' '+(cy+20)+'L'+(cx+10)+' '+(cy+32)+'M'+(cx+10)+' '+(cy+20)+'L'+(cx-2)+' '+(cy+32)+'" stroke="#CF3F37" stroke-width="2.6" stroke-linecap="round"/>'}
  return o;
}
function tenFrame(x,y,n,fill,crossN,crossFrom){
  let o='<rect x="'+x+'" y="'+y+'" width="130" height="52" rx="4" fill="#fff" stroke="'+INK+'" stroke-width="1.6"/><path d="M'+(x+26)+' '+y+'v52M'+(x+52)+' '+y+'v52M'+(x+78)+' '+y+'v52M'+(x+104)+' '+y+'v52M'+x+' '+(y+26)+'h130" stroke="'+INK+'" stroke-width="1" opacity=".5"/>';
  for(let i=0;i<n;i++){const cx=x+13+(i%5)*26,cy=y+13+Math.floor(i/5)*26,bad=crossN&&crossN.includes(i);
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="9.5" '+st(fill,"rgba(0,0,0,.35)",1)+' opacity="'+(bad?.4:1)+'"/>';
    if(bad)o+='<path d="M'+(cx-8)+' '+(cy-8)+'L'+(cx+8)+' '+(cy+8)+'M'+(cx+8)+' '+(cy-8)+'L'+(cx-8)+' '+(cy+8)+'" stroke="#CF3F37" stroke-width="3" stroke-linecap="round"/>'}
  return o;
}
function gridObjs(name,n,x0,y0,cols,dx,dy,k,crossN){let o="";for(let i=0;i<n;i++)o+=obj(name,x0+(i%cols)*dx,y0+Math.floor(i/cols)*dy,k,i<(crossN||0));return o}

/* Cân đĩa */
function panItem(it,x,y){
  if(it.w!==undefined)return '<rect x="'+(x-15)+'" y="'+(y-22)+'" width="30" height="22" rx="4" '+st("#6B7882","#3D4750",1.4)+'/>'+txt(x,y-7,it.w+" kg",11,"middle","#fff");
  return obj(it.o,x,y-19,1.05)+(it.lab?'<rect x="'+(x-19)+'" y="'+(y-52)+'" width="38" height="16" rx="8" fill="#fff" stroke="'+INK+'" stroke-width="1.2"/>'+txt(x,y-40.5,it.lab,11):'');
}
function vzScale(v){
  const t=v.tilt||0,dy=17*t,cx=160,by=48,lx=58,rx=262,ly=by+dy,ry=by-dy;let o="";
  o+='<path d="M140 168h40L172 150H148Z" '+st("#8A5A3B","#5C3A22",1.4)+'/><path d="M160 150V48" stroke="#5C3A22" stroke-width="5" stroke-linecap="round"/>';
  o+='<path d="M'+lx+' '+ly+'L'+rx+' '+ry+'" stroke="#5C3A22" stroke-width="6" stroke-linecap="round"/><circle cx="160" cy="48" r="6" '+st("#F4C13F","#B88A00",1.4)+'/>';
  [[lx,ly,v.left||[]],[rx,ry,v.right||[]]].forEach(p=>{const px=p[0],py=p[1]+46;
    o+='<path d="M'+px+' '+p[1]+'L'+(px-30)+' '+py+'M'+px+' '+p[1]+'L'+(px+30)+' '+py+'" stroke="#5C3A22" stroke-width="1.6"/><path d="M'+(px-38)+' '+py+'H'+(px+38)+'Q'+(px+30)+' '+(py+12)+' '+px+' '+(py+12)+'Q'+(px-30)+' '+(py+12)+' '+(px-38)+' '+py+'Z" '+st("#C9CFD4","#6B7882",1.6)+'/>';
    const its=p[2],n=its.length;its.forEach((it,i)=>{o+=panItem(it,px+(i-(n-1)/2)*(n>1?36:0),py)})});
  return svgWrap(320,185,o,"Cân đĩa");
}
function vzJugs(v){
  let o="";const n=v.list.length,W=320,cell=W/n;
  v.list.forEach((j,i)=>{const cx=cell*i+cell/2,top=18,h=108,w=56,x0=cx-w/2,cap=j.cap,unit=h/cap,fillH=unit*j.l;
    o+='<rect x="'+x0+'" y="'+(top+h-fillH)+'" width="'+w+'" height="'+fillH+'" '+st("#7BBDF0")+' opacity=".85"/>';
    o+='<path d="M'+x0+' '+top+'V'+(top+h)+'H'+(x0+w)+'V'+top+'" fill="none" stroke="'+INK+'" stroke-width="2.6" stroke-linejoin="round"/><path d="M'+(x0+w)+' '+(top+22)+'q16 0 16 22t-16 22" fill="none" stroke="'+INK+'" stroke-width="2.6" stroke-linecap="round"/>';
    for(let k=1;k<=cap;k++){const y=top+h-k*unit;o+='<path d="M'+(x0)+' '+y+'h'+(k%(cap>5?2:1)===0?12:7)+'" stroke="'+INK+'" stroke-width="1.6"/>';if(cap<=5||k%2===0)o+=txt(x0-4,y+3.5,k,10,"end")}
    if(j.lab)o+=txt(cx,top+h+22,j.lab,14)});
  return svgWrap(W,165,o,"Bình đựng nước");
}
/* Tia số */
function vzTia(v){
  let o='<path d="M12 42H300" stroke="'+INK+'" stroke-width="2.6" stroke-linecap="round"/><path d="M300 42l-8-5M300 42l-8 5" stroke="'+INK+'" stroke-width="2.6" stroke-linecap="round" fill="none"/>';
  v.nums.forEach((n,i)=>{const x=30+i*50;o+='<path d="M'+x+' 35v14" stroke="'+INK+'" stroke-width="2.4"/>';
    if(i===v.miss)o+='<rect x="'+(x-17)+'" y="55" width="34" height="24" rx="6" fill="#fff" stroke="#CF3F37" stroke-width="2.4"/>'+txt(x,73,"?",16,"middle","#CF3F37");
    else o+=txt(x,72,n,16)});
  return svgWrap(320,92,o,"Tia số");
}
/* Hình phẳng */
function panelShape(kind,x,y){
  let s="";const dot=(a,b)=>'<circle cx="'+a+'" cy="'+b+'" r="4" '+st("#E4483E")+'/>';
  if(kind==="seg")s='<path d="M12 52L58 18" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>'+dot(12,52)+dot(58,18);
  if(kind==="line")s='<path d="M4 56L66 14" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/><path d="M4 56l8-1M4 56l3-8M66 14l-8 1M66 14l-3 8" stroke="'+INK+'" stroke-width="2.4" stroke-linecap="round" fill="none"/>';
  if(kind==="curve")s='<path d="M8 50Q20 6 36 32T62 20" fill="none" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>';
  if(kind==="poly")s='<path d="M8 52L26 18L44 46L62 14" fill="none" stroke="'+INK+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+dot(8,52)+dot(26,18)+dot(44,46)+dot(62,14);
  if(kind==="quad")s='<polygon points="12,20 58,14 62,54 8,50" '+st("#DDEBFA","#245E93",3)+'/>';
  return '<g transform="translate('+x+' '+y+')"><rect width="70" height="70" rx="10" fill="#fff" stroke="#C9D8CF" stroke-width="2"/>'+s+'</g>';
}
function vzShapes(v){
  const n=v.list.length,gap=(320-n*70)/(n+1);let o="";
  v.list.forEach((k,i)=>{const x=gap+i*(70+gap);o+=panelShape(k,x,10)+txt(x+35,104,"ABCDE"[i],16)});
  return svgWrap(320,114,o,"Các hình để chọn");
}
function vzPoly(v){
  const n=v.pts.length;let d="",o="";v.pts.forEach((p,i)=>{d+=(i?"L":"M")+p[0]+" "+p[1]});
  o+='<path d="'+d+'" fill="none" stroke="#2F85D0" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>';
  v.pts.forEach((p,i)=>{o+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" '+st("#E4483E")+'/>'+txt(p[0],p[1]+(p[2]?-10:20),"ABCDE"[i],15)});
  return svgWrap(320,140,o,"Đường gấp khúc");
}
function vzCol(v){
  let o=v.line?'<path d="M'+v.pts[0][0]+' '+v.pts[0][1]+'L'+v.pts[v.pts.length-1][0]+' '+v.pts[v.pts.length-1][1]+'" stroke="#8FA79A" stroke-width="2" stroke-dasharray="6 5"/>':"";v.pts.forEach(p=>{o+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" '+st("#E4483E")+'/>'+txt(p[0]+10,p[1]-8,p[2],15)});
  return svgWrap(320,150,o,"Các điểm");
}
function vzPat(v){
  const n=v.seq.length+1,cw=Math.min(46,300/n),W=cw*n+20;let o="";
  v.seq.forEach((s,i)=>{o+=shp(s,10+cw*i+cw/2,34,Math.min(1,cw/46*1.05))});
  o+='<rect x="'+(10+cw*(n-1)+4)+'" y="12" width="'+(cw-8)+'" height="44" rx="8" fill="#fff" stroke="#CF3F37" stroke-width="2.4" stroke-dasharray="5 3"/>'+txt(10+cw*(n-1)+cw/2,42,"?",20,"middle","#CF3F37");
  return svgWrap(Math.round(W),68,o,"Dãy hình");
}
function vzMix(v){let o="";v.items.forEach(it=>{o+=shp(it.s,it.x,it.y,.9)});return svgWrap(320,130,o,"Nhiều hình")}
/* Nhân vật và tranh */
function child(pose){
  const skin="#F5D0A8",shirt={read:"#3C8DD9",kick:"#E4483E",kite:"#3DAA5C",draw:"#F29A2E"}[pose];let o='<path d="M6 118H194" stroke="#9CB8A5" stroke-width="3" stroke-linecap="round"/>';
  const arm=(x1,y1,x2,y2)=>'<path d="M'+x1+' '+y1+'L'+x2+' '+y2+'" stroke="'+skin+'" stroke-width="5" stroke-linecap="round"/>',leg=(x1,y1,x2,y2)=>'<path d="M'+x1+' '+y1+'L'+x2+' '+y2+'" stroke="#3B4F8A" stroke-width="7" stroke-linecap="round"/>';
  if(pose==="kick"){o+=leg(66,92,62,116)+leg(74,92,98,106)+shp("ball",114,108,.55)+'<path d="M126 98l8-4M128 108h9M126 118l8 4" stroke="#9CB8A5" stroke-width="2" stroke-linecap="round"/>'}
  else o+=leg(66,92,64,116)+leg(74,92,76,116);
  o+='<rect x="60" y="63" width="20" height="30" rx="6" '+st(shirt,"rgba(0,0,0,.25)",1.2)+'/>';
  if(pose==="read")o+=arm(62,72,86,84)+arm(78,72,90,82)+shp("book",98,78,1.05);
  if(pose==="kick")o+=arm(62,72,46,84)+arm(78,72,94,62);
  if(pose==="kite")o+=arm(62,72,54,94)+arm(78,72,98,48)+'<path d="M98 48Q120 40 146 30" fill="none" stroke="'+INK+'" stroke-width="1.4"/>'+shp("kite",154,22,1.35);
  if(pose==="draw")o+='<path d="M120 118L132 66M168 118L156 66" stroke="#8A5A3B" stroke-width="4" stroke-linecap="round"/><rect x="108" y="22" width="72" height="58" rx="3" '+st("#fff","#8A5A3B",3.5)+'/>'+shp("sun",130,42,.9)+shp("house",158,60,.9)+arm(62,72,76,86)+arm(78,72,104,66)+shp("pencil",110,62,.8);
  o+='<circle cx="70" cy="52" r="11" '+st(skin,"rgba(0,0,0,.3)",1.2)+'/><path d="M59 50A11 11 0 0 1 81 50Q70 43 59 50Z" fill="#5C3A22"/><circle cx="66" cy="54" r="1.4" fill="'+INK+'"/><circle cx="74" cy="54" r="1.4" fill="'+INK+'"/><path d="M66 58q4 3 8 0" fill="none" stroke="'+INK+'" stroke-width="1.4" stroke-linecap="round"/>';
  return o;
}
function vzScene(v){return svgWrap(200,130,child(v.pose),"Bạn nhỏ đang làm việc",250)}
function vzTwo(v){
  let o="";const l=v.l,r=v.r;
  if(v.it==="tree")o+=grp(80,100-l*20+20,l,OBJ.tree())+grp(240,100-r*20+20,r,OBJ.tree())+'<path d="M10 118H310" stroke="#9CB8A5" stroke-width="3" stroke-linecap="round"/>';
  if(v.it==="ball")o+=grp(80,70,l,OBJ.ball())+grp(240,70,r,OBJ.ball());
  if(v.it==="pencil"){const pen=(x,y,len)=>'<g transform="translate('+x+' '+y+')"><rect width="'+len+'" height="14" '+st("#F4C13F","#B88A00",1.6)+'/><polygon points="'+len+',0 '+(len+18)+',7 '+len+',14" '+st("#F2D3A4","#B08A55",1.4)+'/><polygon points="'+(len+13)+',4 '+(len+18)+',7 '+(len+13)+',10" fill="'+INK+'"/><rect x="-8" width="8" height="14" rx="2" '+st("#F28DB2","#C2557F",1.4)+'/></g>';o+=pen(20,32,l)+pen(20,78,r)}
  return svgWrap(320,v.it==="pencil"?112:130,o,"Hai vật để so sánh");
}
function plantStage(i){
  let o='<ellipse cx="48" cy="80" rx="34" ry="9" '+st("#8A5A3B","#5C3A22",1.4)+'/>';
  if(i===0)o+='<ellipse cx="48" cy="72" rx="5" ry="3.4" '+st("#B5793F","#7A4C20",1.2)+'/>';
  if(i===1)o+='<path d="M48 76V50" stroke="#3DAA5C" stroke-width="3.4" stroke-linecap="round"/><path d="M48 54q-14-4-16-14 12 0 16 14zM48 58q14-4 16-14-12 0-16 14z" '+st("#4BBB6B","#27763F",1.2)+'/>';
  if(i===2)o+='<path d="M48 76V34" stroke="#3DAA5C" stroke-width="3.6" stroke-linecap="round"/><path d="M48 62q-14-3-17-13 12 0 17 13zM48 54q14-3 17-13-12 0-17 13z" '+st("#4BBB6B","#27763F",1.2)+'/>'+grp(48,24,.95,[0,72,144,216,288].map(a=>'<circle cx="'+(Math.sin(a*Math.PI/180)*8).toFixed(1)+'" cy="'+(-Math.cos(a*Math.PI/180)*8).toFixed(1)+'" r="6" '+st("#F28DB2","#C2557F",1)+'/>').join("")+'<circle r="5" '+st("#F4C13F","#B88A00",1)+'/>');
  return o;
}
function meltStage(i){
  let o='<path d="M6 86H90" stroke="#9CB8A5" stroke-width="3" stroke-linecap="round"/>';
  if(i===2)o+='<ellipse cx="66" cy="83" rx="22" ry="5" '+st("#F8A5C8","#C8527F",1.2)+'/>'+coneParts(34,40,1,-1);
  else o+=coneParts(48,i===0?38:40,1.05,i);
  return o;
}
function vzSeq(v){
  let o="";const W=320,pw=96,gap=(W-3*pw)/4;
  v.order.forEach((st_,i)=>{const x=gap+i*(pw+gap);
    o+='<g transform="translate('+x+' 6)"><rect width="'+pw+'" height="96" rx="10" fill="#fff" stroke="#C9D8CF" stroke-width="2"/>'+(v.set==="plant"?plantStage(st_):meltStage(st_))+'</g>'+txt(x+pw/2,124,"ABC"[i],16)});
  return svgWrap(W,134,o,"Ba bức tranh");
}
function vzObj(v){return svgWrap(120,100,grp(60,50,2.2,OBJ[v.i]()),"Hình vẽ một vật",150)}
function vizHTML(v){
  if(!v)return "";
  if(v.clock)return clockSVG(v.clock[0],v.clock[1]);
  switch(v.k){
    case"cmp2":{let o='<rect x="8" y="8" width="146" height="104" rx="12" fill="#fff" stroke="#C9D8CF" stroke-width="2"/><rect x="166" y="8" width="146" height="104" rx="12" fill="#fff" stroke="#C9D8CF" stroke-width="2"/>';
      o+=gridObjs(v.it,v.a,28,30,5,26,28,.74)+gridObjs(v.it,v.b,186,30,5,26,28,.74);return svgWrap(320,120,o,"Hai rổ đồ vật")}
    case"rows":{let o=gridObjs(v.it,v.a,24,30,12,25,0,.7)+gridObjs(v.it,v.b,24,80,12,25,0,.7)+'<path d="M8 55H312" stroke="#C9D8CF" stroke-width="2" stroke-dasharray="4 4"/>';return svgWrap(320,108,o,"Hai hàng đồ vật")}
    case"group":return svgWrap(320,v.n>8?96:62,gridObjs(v.it,v.n,30,v.n>8?28:30,8,34,34,.95,v.cross||0),"Nhóm đồ vật");
    case"rods2":return svgWrap(320,80,rods(v.a,10,14)+'<path d="M160 8V72" stroke="#C9D8CF" stroke-width="2" stroke-dasharray="4 4"/>'+rods(v.b,176,14),"Que tính của hai số");
    case"rodsadd":return svgWrap(320,80,rods(v.a,12,14)+txt(158,52,"+",28)+rods(v.b,186,14),"Que tính của hai số");
    case"rodsub":return svgWrap(320,80,rods(v.a,30,14,v.tb,v.ub),"Que tính, phần gạch chéo là bớt đi");
    case"tia":return vzTia(v);
    case"ten":return svgWrap(320,80,tenFrame(14,14,v.a,"#F27B6E",v.cross1)+(v.plus?txt(160,52,"+",26):"")+tenFrame(176,14,v.b,"#6AAFE6",v.cross2),"Hai khung mười ô");
    case"scale":return vzScale(v);
    case"jugs":return vzJugs(v);
    case"shapes":return vzShapes(v);
    case"poly":return vzPoly(v);
    case"col":return vzCol(v);
    case"pat":return vzPat(v);
    case"mix":return vzMix(v);
    case"scene":return vzScene(v);
    case"two":return vzTwo(v);
    case"seq":return vzSeq(v);
    case"obj":return vzObj(v);
  }
  return "";
}

<script>
/* ===== Góc phụ huynh ===== */
function weekStats(){
  const t=todayKey();let done=0,c=0,n=0,st=0;
  for(let i=0;i<7;i++){const d=S.days[addDays(t,-i)];if(!d)continue;if(d.done)done++;c+=(d.correct||0)+(d.xcorrect||0);n+=(d.total||0)+(d.xtotal||0);st+=(d.stars||0)+(d.xstars||0)}

/* ===== Kết quả kiểm tra đầu vào, lộ trình ===== */
function ratingChip(r){return r==="ind"?'<span class="chip ok">Làm độc lập</span>':r==="hint"?'<span class="chip vi">Làm khi có gợi ý</span>':'<span class="chip err">Cần học lại</span>'}

  o+=ev.groups.filter(g=>!PLACE_GROUPS[g.g].adv).map(rows).join("");

  if(!toan)o+='<h3>Phụ huynh cần quan sát thêm</h3><p class="small muted">Bài trên máy không kiểm tra được đọc thành tiếng, viết chữ và nói nghe. Nên xem thêm:</p><ul class="small"><li>Con đọc to một đoạn khoảng 5 câu trong bài đã học: đọc đúng, ngắt nghỉ, hiểu nghĩa.</li><li>Con viết 3 câu theo lời đọc: chữ viết, chính tả, dấu câu, viết hoa.</li><li>Con kể lại một việc đã làm ở nhà bằng 2 đến 3 câu.</li></ul>';

/* ===== Màn hình làm bài ===== */
const curSess=()=>ui.play==="daily"?S.daily:ui.play==="place"?S.place.cur[ui.placeSubj]:S.extra;
function resetInput(){ui.sel=null;ui.num="";ui.fb=null;ui.try=1;ui.tried=[]}
function renderPlay(){
  if(ui.play==="placeRes")return renderPlaceRes();
  const s=curSess();if(!s){ui.play=null;return header()+viewHome()}
  if(s.finished)return renderResult(s);
  if(ui.inter&&ui.play==="daily")return renderInter(ui.inter);
  const q=s.qs[s.i],total=s.qs.length,fb=ui.fb,def=SKILLS[q.skill];
  let o='<div class="top"><button class="btn alt" data-act="exit">Thoát</button><div class="pills"><span class="pill">Câu '+(s.i+1)+'/'+total+'</span></div></div>';
  o+='<div class="card"><div class="bar"><i style="width:'+Math.round(s.i/total*100)+'%"></i></div><div class="chips"><span class="chip'+(def.subj==="vi"?" vi":"")+'">'+esc(def.name)+'</span>'+(q.retry?'<span class="chip err">Câu sửa lỗi</span>':'')+(s.mode==="extra"?'<span class="chip ok">'+esc(s.label||"Luyện thêm")+' · không bắt buộc</span>':'')+(s.mode==="place"?'<span class="chip ok">Kiểm tra đầu vào</span>':'')+'</div>';
  if(q.ctx)o+='<div class="ctx">'+fmt(q.ctx)+'</div>';
  if(q.viz)o+='<div class="viz'+(q.viz.k?' pic':'')+'">'+vizHTML(q.viz)+'</div>';
  o+='<div class="qtext">'+fmt(q.prompt)+'</div>';
  if(q.type==="choice"){
    const long=q.opts.some(x=>x.length>12),tri=q.opts.length===3&&!long;
    o+='<div class="opts'+(long&&q.opts.some(x=>x.length>22)?" one":"")+'"'+(tri?' style="grid-template-columns:repeat(3,1fr)"':'')+'>'+q.opts.map((x,i)=>{
      let c="opt";const tr=(ui.tried||[]).includes(i);if(fb){if(i===q.a)c+=" right";else if(i===ui.sel||tr)c+=" wrong"}else if(tr)c+=" wrong";
      return '<button class="'+c+'" data-act="pick" data-i="'+i+'" aria-pressed="'+(ui.sel===i)+'"'+(fb||tr?" disabled":"")+'>'+esc(x)+'</button>'}).join("")+'</div>';
  }else{
    o+='<div class="numbox'+(fb?(fb.ok?" right":" wrong"):"")+'" aria-live="polite">'+(ui.num===""?'<span class="muted">…</span>':esc(ui.num))+'</div>'+
     '<div class="keys">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button class="key" data-act="key" data-k="'+n+'"'+(fb?" disabled":"")+'>'+n+'</button>').join("")+
     '<button class="key" data-act="key" data-k="del" style="font-size:1rem"'+(fb?" disabled":"")+'>Xóa</button><button class="key" data-act="key" data-k="0"'+(fb?" disabled":"")+'>0</button><span></span></div>';
  }
  if(fb){
    o+=fb.ok?'<div class="fb ok"><b>Đúng rồi!'+(fb.gain?" +1 sao":"")+'</b>'+(fb.st==="hint"?'<span>Con đã làm được sau khi xem gợi ý.</span>':'')+'</div>':
      '<div class="fb no"><b>Chưa đúng</b><span>Đáp án đúng: <b>'+esc(ansText(q))+'</b></span>'+(q.why?'<span>'+esc(q.why)+'</span>':'')+'<span class="small">Câu này sẽ quay lại trong bài những ngày sau để con ôn.</span></div>';
    o+='<button class="btn big" data-act="next">'+(s.i>=total-1?"Xem kết quả":"Câu tiếp theo")+'</button>';
  }else{
    if(s.mode==="place"&&ui.try>1)o+='<div class="fb hint"><b>Gợi ý</b><span>'+esc(q.hint||"Đọc kỹ đề và thử lại.")+'</span><span class="small">Con thử lại một lần nữa nhé.</span></div>';
    const ready=q.type==="number"?ui.num!=="":ui.sel!==null;
    o+='<button class="btn big" data-act="check"'+(ready?"":" disabled")+'>Kiểm tra</button>';
  }
  return o+'</div>';
}
function renderResult(s){
  const sm=s.summary||{correct:s.res.filter(r=>r&&r.ok).length,total:s.qs.length,bonus:0,stars:s.gain||0,newBadges:[],streak:streak()};
  const r=sm.correct/sm.total,tn=esc(S.profile.teacher),kn=esc(S.profile.name),
    msg=r===1?"Tuyệt vời! "+kn+" làm đúng hết, "+tn+" rất tự hào!":r>=.8?"Giỏi lắm! "+tn+" khen "+kn+" làm bài rất tốt.":r>=.5?"Cố gắng tốt! Những câu sai sẽ được ôn lại ở các bài sau.":"Không sao đâu "+kn+" nhé. Mỗi câu sai là một lần học thêm.";
  let o='<div class="top"><span></span></div><div class="card res">'+chicoSVG(72)+'<div class="muted">'+(s.mode==="daily"?"Bài hôm nay":(s.label||"Luyện thêm"))+'</div><div class="score">'+sm.correct+'/'+sm.total+'</div><h2>'+msg+'</h2>'+
   '<div class="pills"><span class="pill star">'+starI+'+'+sm.stars+' sao</span>'+(s.mode==="daily"?'<span class="pill fire">'+fireI+sm.streak+' ngày liên tiếp</span>':'')+'</div>'+
   (sm.bonus?'<p class="small muted">Gồm '+sm.bonus+' sao thưởng (hoàn thành bài, điểm tuyệt đối, mốc chuỗi ngày).</p>':'')+
   (sm.newBadges.length?'<div class="chips" style="justify-content:center">'+sm.newBadges.map(id=>'<span class="chip ok">Huy hiệu mới: '+BADGES.find(b=>b.id===id).name+'</span>').join("")+'</div>':'')+'</div>';
  const wrong=s.qs.map((q,i)=>({q,i})).filter(x=>!(s.res[x.i]&&s.res[x.i].ok));
  if(wrong.length)o+='<div class="card"><h3>Những câu cần xem lại</h3>'+wrong.map(x=>'<div class="err-item"><span>'+esc(flat(x.q.ctx?x.q.prompt:x.q.prompt))+(x.q.viz?'<div class="viz pic mini">'+vizHTML(x.q.viz)+'</div>':'')+'</span><b>Đáp án: '+esc(ansText(x.q))+'</b></div>').join("")+'</div>';
  const back=ui.resume&&s.mode==="extra";
  return o+(back?'<button class="btn big" data-act="resume">'+(S.daily.finished?"Xem kết quả bài hôm nay":"Tiếp tục bài hôm nay")+'</button>':'<button class="btn big" data-act="exit">Về trang chính</button>');
}

/* ===== Điều khiển ===== */
function advance(s){
  while(!s.finished&&s.res[s.i]){
    const cur=s.qs[s.i],nxt=s.qs[s.i+1],sec=SKILLS[cur.skill].subj;
    if(s.mode==="daily"&&(!nxt||SKILLS[nxt.skill].subj!==sec)&&!(s.offered&&s.offered[sec])){
      s.offered=s.offered||{};s.offered[sec]=true;s.pend=sec;ui.inter=sec;persist();return;
    }
    if(s.i>=s.qs.length-1){finish(s);break}
    s.i++;
  }
}
function rebuildToday(){if(S.daily&&!S.daily.res.length&&!S.daily.finished)S.daily=buildSession("daily",todayKey())}
function act(a,ds){
  let keep=false;
  switch(a){
    case"tab":ui.tab=ds.t;ui.confirm=false;ui.msg=null;ui.custom=null;if(ds.t!=="parent")ui.unlocked=false;break;
    case"by":ui.by=ds.v;keep=true;break;
    case"award":{const t=TASKS.find(x=>x.id===ds.id);if(t)applyTask(t.t,t.label,taskPts(t),"",t.id);keep=true;break}
    case"customOpen":ui.custom=ui.custom===ds.t?null:ds.t;keep=true;break;
    case"customDo":{
      const pe=document.getElementById("cust-pts"),ne=document.getElementById("cust-note"),n=Math.round(Number(pe&&pe.value));
      if(!(n>=1&&n<=100)){showToast("Hãy nhập số sao từ 1 đến 100.",0)}
      else{applyTask(ui.custom,ui.custom==="bonus"?"Thưởng khác":"Trừ khác",n,((ne&&ne.value)||"").trim().slice(0,60),"");ui.custom=null}
      keep=true;break}
    case"undo":undoTask(Number(ds.n));keep=true;break;
    case"unlock":{const el=document.getElementById("pin-in");if(el&&el.value===S.profile.pin){ui.unlocked=true;ui.pinErr=false}else ui.pinErr=true;keep=true;break}
    case"startDaily":ensureDaily();ui.play="daily";ui.resume=null;ui.inter=S.daily.pend||null;if(!ui.inter)advance(S.daily);resetInput();break;
    case"skipBonus":{const s=S.daily;s.pend=null;ui.inter=null;advance(s);persist();resetInput();break}
    case"doBonus":{
      const s=S.daily,sec=ui.inter||s.pend;s.pend=null;ui.inter=null;advance(s);
      S.extra=buildSession("extra",todayKey(),{subj:sec,n:3,salt:String(Date.now()),label:"Bài tập thêm "+(sec==="toan"?"Toán":"Tiếng Việt")});
      persist();ui.resume="daily";ui.play="extra";resetInput();break}
    case"resume":ui.play=ui.resume||null;ui.resume=null;resetInput();break;
    case"skilltoggle":{S.profile.skillOff=S.profile.skillOff||{};if(ds.v==="0")S.profile.skillOff[ds.id]=true;else delete S.profile.skillOff[ds.id];rebuildToday();persist();keep=true;break}
    case"skillcap":{S.profile.cap=S.profile.cap||{};S.profile.cap[ds.id]=Number(ds.n);rebuildToday();persist();keep=true;break}
    case"result":ui.play="daily";break;
    case"startExtra":S.extra=buildSession("extra",todayKey(),{subj:ds.subj,skill:ds.skill,pic:!!ds.pic,label:ds.pic?"Luyện qua hình":"",salt:String(Date.now())});persist();ui.play="extra";resetInput();break;
    case"startErrors":S.extra={mode:"extra",date:todayKey(),qs:S.errors.slice(0,5).map(e=>Object.assign({},e.q)),i:0,res:[],finished:false,started:Date.now()};persist();ui.play="extra";resetInput();break;
    case"pick":if(!ui.fb)ui.sel=Number(ds.i);keep=true;break;
    case"key":if(!ui.fb){if(ds.k==="del")ui.num=ui.num.slice(0,-1);else if(ui.num.length<3)ui.num=(ui.num==="0"?"":ui.num)+ds.k}keep=true;break;
    case"check":{const s=curSess(),q=s.qs[s.i];if(ui.fb)return;const g=q.type==="number"?(ui.num===""?null:ui.num):ui.sel;if(g===null)return;
      if(s.mode==="place"){const r=answerPlace(s,g);if(r.retry){ui.try=2;if(q.type==="choice")ui.tried.push(g);ui.sel=null;ui.num="";ui.fb=null}else ui.fb=r}else ui.fb=answer(s,g);
      keep=true;break}
    case"next":{const s=curSess();if(s.mode==="place"){advancePlace(s);persist();resetInput();break}advance(s);persist();resetInput();break}
    case"placeStart":{const P=S.place,sb=ds.subj;if(!P.cur[sb])P.cur[sb]=buildPlacement(sb);const s=P.cur[sb];
      while(s.res[s.i]&&s.i<s.qs.length-1)s.i++;persist();resetInput();
      if(s.res[s.qs.length-1]){finishPlace(s)}else{ui.play="place";ui.placeSubj=sb}break}
    case"placeView":ui.play="placeRes";ui.placeSubj=ds.subj||null;break;
    case"placeRedo":{const P=S.place,sb=ds.subj;P.res[sb]=null;delete P.res[sb];delete P.cur[sb];P.adv[sb]=false;P.runs=(P.runs||0)+1;S.focus=S.focus.filter(id=>SKILLS[id]&&SKILLS[id].subj!==sb);rebuildToday();persist();keep=true;break}
    case"advset":S.place.adv[ds.subj]=ds.v==="1";rebuildToday();persist();keep=true;break;
    case"exit":ui.play=null;ui.resume=null;ui.inter=null;resetInput();break;
    case"perday":S.profile.perDay=Number(ds.n);if(S.daily&&!S.daily.res.length&&!S.daily.finished)S.daily=buildSession("daily",todayKey());persist();keep=true;break;
    case"rewardGiven":S.profile.rewardBase=S.stars;persist();break;
    case"exportData":exportData();keep=true;break;
    case"resetAsk":ui.confirm=true;keep=true;break;
    case"resetNo":ui.confirm=false;keep=true;break;
    case"resetDo":S=defaults();ui.confirm=false;ui.tab="home";ensureDaily();persist();break;
  }
  render();if(!keep)window.scrollTo(0,0);
}
function render(){
  if(ui.play)$app().innerHTML=renderPlay();
  else $app().innerHTML=header()+({home:viewHome,practice:viewPractice,prog:viewProg,parent:viewParent}[ui.tab])();
  renderTabs();paintStatus();
}
function onClick(e){const b=e.target.closest("[data-act]");if(b&&!b.disabled)act(b.dataset.act,b.dataset)}
$app().addEventListener("click",onClick);
document.getElementById("tabs").addEventListener("click",onClick);
$app().addEventListener("change",e=>{
  if(e.target.id==="impFile"){const f=e.target.files&&e.target.files[0];if(f){const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(f)}return}
  const t=e.target,k=t.dataset&&t.dataset.set;if(!k)return;
  if(k==="name")S.profile.name=t.value.trim()||"Bé";
  if(k==="rname")S.profile.rewardName=t.value.trim()||"Phần thưởng";
  if(k==="teacher")S.profile.teacher=t.value.trim()||"Cô Dung";
  if(k==="pin"){const v=t.value.replace(/\D/g,"").slice(0,4);if(v===""||v.length===4){S.profile.pin=v;ui.unlocked=true}t.value=S.profile.pin}
  if(k==="pts"){const n=Math.min(50,Math.max(1,Math.round(Number(t.value))||1));S.profile.taskPts[t.dataset.id]=n;t.value=n}
  if(k==="lesson"){S.profile.mathLesson=Math.min(36,Math.max(1,Number(t.value)||25));rebuildToday();persist();render();return}
  if(k==="rtarget"){S.profile.rewardTarget=Math.min(1000,Math.max(10,Math.round(Number(t.value))||100));t.value=S.profile.rewardTarget}
  persist();
});
document.addEventListener("keydown",e=>{
  if(!ui.play||e.target.tagName==="INPUT")return;const s=curSess();if(!s||s.finished||ui.inter)return;
  if(e.key==="Enter"&&e.target.tagName==="BUTTON")return;
  const q=s.qs[s.i];
  if(ui.fb){if(e.key==="Enter")act("next",{});return}
  if(q.type!=="number")return;
  if(/^[0-9]$/.test(e.key))act("key",{k:e.key});else if(e.key==="Backspace")act("key",{k:"del"});else if(e.key==="Enter")act("check",{});
});
(function init(){
  const l=loadLocal();if(l)S=mergeState(l);
  ensureDaily();render();connectDb();
})();
</script>
